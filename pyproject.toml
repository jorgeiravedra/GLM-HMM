[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glmhmm"
version = "0.1.0"
description = "Switching linear-Gaussian regression (input-driven HMM) for multi-fiber photometry"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
include = ["glmhmm*"]
